eureka:
  instance:
    hostname: localhost
    lease-renewal-interval-in-seconds: 10   # heartbeat (default 30s)
    lease-expiration-duration-in-seconds: 30 # evict after missed heartbeats (default 90s)
  client:
    healthcheck:
      enabled: true                          # publish actuator health (DB down => DOWN => no traffic)
    service-url:
      defaultZone: http://localhost:8761/eureka
server:
  port: 8081
spring:
  application:
    name: authentication-services
  data:
    redis:                 # token revocation list, shared with the gateway
      host: 127.0.0.1
      port: 6379
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/db-acl
    username: postgres
    password: 7f443b89717d5c28ce8a0f19a6f1af7b
  jpa:
    hibernate:
      ddl-auto: none
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
applications:
  jwtConfig:
    header: Authorization
    expirationDateInMs: 3600000
    refreshExpirationDateInMs: 7200000
    # RS256 signing key (PKCS#8, base64). Only this service holds it.
    privateKey: 