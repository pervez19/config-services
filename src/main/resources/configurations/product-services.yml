eureka:
  instance:
    hostname: localhost
    lease-renewal-interval-in-seconds: 10   # heartbeat (default 30s)
    lease-expiration-duration-in-seconds: 30 # evict after missed heartbeats (default 90s)
  client:
    healthcheck:
      enabled: true                          # publish actuator health (DB down => DOWN => no traffic)
    service-url:
      defaultZone: http://localhost:8761/eureka
server:
  port: 8091
spring:
  application:
    name: product-services
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/db-product-service
    username: postgres
    password: 7f443b89717d5c28ce8a0f19a6f1af7b
  jpa:
    hibernate:
      ddl-auto: none
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
