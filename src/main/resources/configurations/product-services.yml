eureka:
  instance:
    hostname: localhost
    lease-renewal-interval-in-seconds: 10   # heartbeat (default 30s)
    lease-expiration-duration-in-seconds: 30 # evict after missed heartbeats (default 90s)
  client:
    healthcheck:
      enabled: true                          # publish actuator health (DB down => DOWN => no traffic)
    service-url:
      defaultZone: http://localhost:8761/eureka
server:
  port: 8091
spring:
  application:
    name: product-services
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/db-product-service
    username: postgres
    password: '{cipher}0feb0be69e4a420178bf4b5128c0da52872ebf06acee5ffe7de9af9bdce3f1b60d005a9ea407718423c4da3202787596bc297bc5b8ba88f6c0e1eb3c6bde9461'
  jpa:
    hibernate:
      ddl-auto: none
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
