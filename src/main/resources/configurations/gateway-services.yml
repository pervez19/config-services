server:
  port: 8080
spring:
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  cloud:
    gateway:
      # Routes are declared in GatewayRouteConfiguration with lb:// URIs so every route keeps
      # JWT + API-key checks. The discovery locator is NOT enabled: its auto-generated routes
      # would bypass AuthenticationFilter and expose every registered service.
      httpclient:
        connect-timeout: 2000      # ms
        response-timeout: 10s
    loadbalancer:
      cache:
        ttl: 5s                    # pick up new/removed instances quickly (default 35s)
eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: true     # gateway shows up in the Eureka dashboard with its health
    fetch-registry: true
    registry-fetch-interval-seconds: 5
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka
management:
  endpoints:
    web:
      exposure:
        include: health,info       # do not expose the 'gateway' endpoint: it allows editing routes
applications:
  jwtConfig:
    prefix: Bearer
    secret: '{cipher}645ffc19a654f62d780eac98923628b269c9a677fa9af54eaeb3078d9533091f9b88f865025627f542d1a2eb6bb5d2fe1f70d17d5b86a7d44813396724d5d21256f499f404914301e1ad6a0e85e65b25ddf862f4028be8da8c1f26d2614a49eb78f4396f6b740b1c47ce3fab2a2c50d7'
