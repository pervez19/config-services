# Values in configurations/*.yml are plain text (no ENCRYPT_KEY needed).
# Optional: to store a value encrypted as '{cipher}...', start this server with an ENCRYPT_KEY env var and use
#   curl -H "Content-Type: text/plain" --data-binary "my-secret" localhost:8888/encrypt
server:
  port: 8888
spring:
  profiles:
    active: native
  application:
    name: config-server
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/configurations
