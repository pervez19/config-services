# Secrets in configurations/*.yml are stored as '{cipher}...' and decrypted here before being served.
# The key comes from the ENCRYPT_KEY environment variable (binds to encrypt.key); it is never committed.
# Encrypt a new value:  curl -H "Content-Type: text/plain" --data-binary "my-secret" localhost:8888/encrypt
server:
  port: 8888
spring:
  profiles:
    active: native
  application:
    name: config-server
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/configurations
